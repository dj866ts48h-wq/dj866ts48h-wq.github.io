<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLASST</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/horizon');

    :root {
      --bg: #000000;
      --pink: #F700B5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Horizon', 'Arial Black', sans-serif;
    }

    .cover {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      background: #000;
      overflow: hidden;
      isolation: isolate;
    }

    .bg-words {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3vh 4vw;
    }

    .word-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.12em;
      width: 100%;
      height: 100%;
      transform: scaleX(1.24) scaleY(0.9);
      transform-origin: center;
    }

    .bg-word {
      display: block;
      font-family: 'Horizon', 'Arial Black', sans-serif;
      font-size: clamp(2.5rem, 10vw, 16rem);
      line-height: 0.72;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--white);
      text-align: center;
      white-space: nowrap;
      opacity: 0.98;
      text-rendering: geometricPrecision;
    }

    .logo-wrap {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      font-family: 'Horizon', 'Arial Black', sans-serif;
      font-size: clamp(5.1rem, 22vw, 24rem);
      line-height: 0.8;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--white);
      text-align: center;
      white-space: nowrap;
      transform: scaleX(1.08) translateY(-0.02em);
      transform-origin: center;
      text-rendering: geometricPrecision;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.12));
      z-index: 30;
    }

    .graffiti {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 120vw;
      height: 58vh;
      transform: translate(-50%, -50%) rotate(-12deg);
      z-index: 15;
      overflow: visible;
      pointer-events: none;
      filter: saturate(1.15);
    }

    .graffiti .star-fill {
      fill: var(--pink);
      stroke: var(--pink);
      stroke-width: 10;
      stroke-linejoin: round;
    }

    .graffiti .drip {
      fill: var(--pink);
    }

    .graffiti .text-fill {
      fill: var(--white);
      font-family: 'Horizon', 'Arial Black', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.08em;
    }

    @media (max-width: 540px) {
      .word-stack {
        transform: scaleX(1.18) scaleY(0.88);
        gap: 0.1em;
      }

      .bg-word {
        font-size: clamp(2.2rem, 14vw, 7rem);
      }

      .graffiti {
        width: 130vw;
        height: 50vh;
      }
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="Portada BLASST">
    <div class="bg-words" aria-hidden="true">
      <div class="word-stack">
        <span class="bg-word">MUSIC</span>
        <span class="bg-word">DANCE</span>
        <span class="bg-word">DRINKS</span>
        <span class="bg-word">HAPPINESS</span>
        <span class="bg-word">FRIENDS</span>
        <span class="bg-word">KISSES</span>
      </div>
    </div>

    <svg class="graffiti" viewBox="0 0 1400 980" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="starClip">
          <path d="M571 104L706 329L980 361L779 541L842 817L571 669L301 818L364 542L162 360L436 329L571 104Z"/>
        </clipPath>
      </defs>

      <g>
        <path class="star-fill" d="M571 104L706 329L980 361L779 541L842 817L571 669L301 818L364 542L162 360L436 329L571 104Z"/>

        <g clip-path="url(#starClip)">
          <g class="text-layer" font-size="170">
            <text class="text-fill" x="270" y="385" transform="rotate(-2 270 385)">MUSIC</text>
            <text class="text-fill" x="300" y="550" transform="rotate(-2 300 550)">DANCE</text>
            <text class="text-fill" x="240" y="720" transform="rotate(-2 240 720)">DRINKS</text>
            <text class="text-fill" x="520" y="250" transform="rotate(-3 520 250)">HAPPINESS</text>
            <text class="text-fill" x="500" y="450" transform="rotate(-3 500 450)">FRIENDS</text>
            <text class="text-fill" x="430" y="640" transform="rotate(-3 430 640)">KISSES</text>
          </g>
        </g>

        <path class="drip" d="M510 700L512 792C507 820 488 845 468 860L458 886L445 857C417 812 409 742 432 702L510 700Z"/>
        <path class="drip" d="M605 722L597 847C592 884 571 918 545 942L525 965L511 942C495 911 482 873 484 835L492 722L605 722Z"/>
        <path class="drip" d="M671 712L674 806C676 848 694 884 724 908L744 928L758 908C779 879 790 836 788 794L783 710L671 712Z"/>
        <path class="drip" d="M440 638L443 708C445 732 451 754 468 770L486 782L500 766C523 742 533 713 530 673L525 636L440 638Z"/>
        <path class="drip" d="M318 572L296 647C286 678 293 712 315 739L332 756L346 740C363 718 370 688 366 648L350 570L318 572Z"/>
      </g>
    </svg>

    <div class="logo-wrap">
      <div class="logo" aria-label="BLASST">BLASST</div>
    </div>
  </main>
</body>
</html>
