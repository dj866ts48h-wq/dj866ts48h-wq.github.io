<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLASST</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #d84fb5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      position: relative;
    }

    /* CONTENEDOR DEL LOGO CON BRILLO */

    .logo-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    /* BRILLO ANIMADO DETRÁS DEL LOGO */

    .glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 70%, transparent 100%);
      border-radius: 50%;
      filter: blur(60px);
      animation: glowAnimation 3s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes glowAnimation {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.8;
      }
      100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
    }

    /* LOGO CON IMAGEN */

    .logo {
      max-width: 220px;
      width: 100%;
      height: auto;
      animation: popLogo 1s cubic-bezier(.17,.89,.32,1.49);
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
    }

    /* BOTONES */

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 45px;
      width: 100%;
      max-width: 420px;
      flex-wrap: wrap;
      justify-content: center;

      animation: appear 1s ease 0.35s both;
    }

    button {
      flex: 1;
      min-width: 180px;
      border: 2px solid white;
      background: white;
      color: #d84fb5;

      padding: 16px 10px;
      border-radius: 100px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;

      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:active {
      transform: scale(0.94);
    }

    /* FONDO OSCURO DEL POPUP */

    .overlay {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.45);

      display: none;
      justify-content: center;
      align-items: center;

      padding: 25px;
      z-index: 10;
    }

    .overlay.active {
      display: flex;
    }

    /* POPUP */

    .popup {
      width: 100%;
      max-width: 380px;

      background: white;
      border-radius: 28px;

      padding: 35px 25px;

      text-align: center;

      animation: popupIn 0.35s cubic-bezier(.17,.89,.32,1.28);
    }

    .popup h2 {
      color: #d84fb5;
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .popup p {
      color: #333;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .maps {
      display: block;
      text-decoration: none;

      background: #d84fb5;
      color: white;

      padding: 15px;
      border-radius: 100px;

      font-size: 13px;
      font-weight: 800;

      margin-bottom: 10px;
      transition: 0.2s ease;
    }

    .maps:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(216, 79, 181, 0.3);
    }

    .close {
      background: #f1f1f1;
      color: #333;
      border: none;
      width: 100%;
    }

    /* PÁGINA PRÓXIMAMENTE */

    .proximamente-page {
      position: fixed;
      inset: 0;
      background: #d84fb5;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 30px;
    }

    .proximamente-page.active {
      display: flex;
    }

    .proximamente-page h1 {
      color: white;
      font-size: clamp(48px, 15vw, 120px);
      text-align: center;
      margin-bottom: 40px;
      animation: popLogo 0.8s cubic-bezier(.17,.89,.32,1.49);
      text-shadow: 0 5px 0 rgba(0,0,0,0.08), 0 12px 30px rgba(0,0,0,0.15);
    }

    .proximamente-page button {
      background: white;
      color: #d84fb5;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* ANIMACIONES */

    @keyframes popLogo {
      0% {
        opacity: 0;
        transform: scale(0.2);
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- LOGO CON BRILLO ANIMADO -->
    <div class="logo-container">
      <div class="glow"></div>
      <img src="blasst-logo.png" alt="BLASST Logo" class="logo">
    </div>

    <div class="buttons">

      <button onclick="openLocation()">
        VER UBICACIÓN
      </button>

      <button onclick="openMerch()">
        MERCH
      </button>

    </div>

  </main>


  <!-- POPUP UBICACIÓN -->

  <div class="overlay" id="locationPopup">

    <div class="popup">

      <h2>📍 UBICACIÓN</h2>

      <p>
        Baños de Agua Santa<br>
        Ecuador
      </p>

      <a
        class="maps"
        href="https://www.google.com/maps/search/?api=1&query=Baños+de+Agua+Santa,+Ecuador"
        target="_blank"
      >
        ABRIR EN MAPS
      </a>

      <button class="close" onclick="closePopups()">
        CERRAR
      </button>

    </div>

  </div>


  <!-- PÁGINA PRÓXIMAMENTE -->

  <div class="proximamente-page" id="proximamentePage">
    <h1>PRÓXIMAMENTE</h1>
    <button onclick="closeMerch()">VOLVER</button>
  </div>


  <script>

    function openLocation() {
      document.getElementById("locationPopup").classList.add("active");
    }

    function openMerch() {
      document.getElementById("proximamentePage").classList.add("active");
    }

    function closePopups() {
      document.getElementById("locationPopup").classList.remove("active");
    }

    function closeMerch() {
      document.getElementById("proximamentePage").classList.remove("active");
    }

    /* Cerrar tocando fuera del cuadro */

    document.getElementById("locationPopup").addEventListener("click", function(event) {
      if (event.target === this) {
        closePopups();
      }
    });

  </script>

</body>
</html>
