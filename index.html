<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLASST</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #d84fb5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      position: relative;
    }

    /* Brillo suave del fondo */
    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      filter: blur(70px);
      animation: glow 4s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(0.9);
        opacity: 0.5;
      }
      to {
        transform: scale(1.2);
        opacity: 0.9;
      }
    }

    /* Logo */
    .logo {
      position: relative;
      z-index: 2;
      color: white;
      font-size: clamp(65px, 20vw, 130px);
      font-weight: 900;
      letter-spacing: -6px;
      text-shadow:
        0 5px 0 rgba(0, 0, 0, 0.08),
        0 10px 30px rgba(0, 0, 0, 0.15);

      opacity: 0;
      transform: scale(0.2);
      animation: popLogo 0.8s cubic-bezier(.17,.67,.35,1.35) 0.2s forwards;
    }

    @keyframes popLogo {
      0% {
        opacity: 0;
        transform: scale(0.2);
      }

      70% {
        opacity: 1;
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Botón */
    .location-button {
      position: relative;
      z-index: 3;
      margin-top: 55px;
      padding: 17px 32px;
      border: 2px solid white;
      border-radius: 50px;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      animation: buttonAppear 0.7s ease 1s forwards;
    }

    .location-button:hover {
      background: white;
      color: #d84fb5;
      transform: translateY(-3px);
    }

    .location-button:active {
      transform: scale(0.95);
    }

    @keyframes buttonAppear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ventana de ubicación */
    .location-box {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 50%;
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 25px;
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s ease;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .location-box.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .location-box h2 {
      color: #d84fb5;
      font-size: 24px;
      margin-bottom: 15px;
    }

    .location-box p {
      color: #333;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .map-button {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 30px;
      background: #d84fb5;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .close-button {
      display: block;
      margin: 18px auto 0;
      border: none;
      background: none;
      color: #777;
      font-size: 14px;
      cursor: pointer;
    }

    /* Fondo oscuro cuando se abre la ubicación */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="glow"></div>

    <!-- LOGO -->
    <div class="logo">
      BLASST
    </div>

    <!-- BOTÓN -->
    <button class="location-button" onclick="openLocation()">
      VER UBICACIÓN
    </button>

  </main>

  <!-- FONDO OSCURO -->
  <div class="overlay" id="overlay" onclick="closeLocation()"></div>

  <!-- UBICACIÓN -->
  <div class="location-box" id="locationBox">

    <h2>📍 UBICACIÓN</h2>

    <!-- CAMBIA ESTE TEXTO POR LA UBICACIÓN DEL EVENTO -->
    <p>
      Baños de Agua Santa<br>
      Ecuador
    </p>

    <!-- CAMBIA ESTE LINK POR EL LINK DE GOOGLE MAPS -->
    <a
      class="map-button"
      href="https://maps.google.com/"
      target="_blank">
      ABRIR EN MAPS
    </a>

    <button class="close-button" onclick="closeLocation()">
      CERRAR
    </button>

  </div>

  <script>

    function openLocation() {
      document.getElementById("locationBox").classList.add("active");
      document.getElementById("overlay").classList.add("active");
    }

    function closeLocation() {
      document.getElementById("locationBox").classList.remove("active");
      document.getElementById("overlay").classList.remove("active");
    }

  </script>
