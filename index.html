<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLASST</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/horizon');

    :root {
      --bg: #000000;
      --pink: #F700B5;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Horizon', sans-serif;
    }

    section:not(.cover) {
      display: none !important;
    }

    .cover {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      background: #000;
      overflow: hidden;
      isolation: isolate;
    }

    .bg-words {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 7vh 7vw;
      z-index: 1;
    }

    .word-stack {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.12em;
      width: 100%;
      height: 100%;
      transform: scaleY(0.96);
    }

    .bg-word {
      display: block;
      color: var(--white);
      font-family: 'Horizon', sans-serif;
      font-size: clamp(3.2rem, 11vw, 17rem);
      line-height: 0.7;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      opacity: 0.98;
    }

    .logo-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .logo {
      position: relative;
      display: block;
      font-family: 'Horizon', sans-serif;
      font-size: clamp(5rem, 22vw, 24rem);
      line-height: 0.8;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--white);
      text-align: center;
      white-space: nowrap;
      transform: translateY(-0.04em);
    }

    .graffiti {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 116vw;
      height: 52vh;
      transform: translate(-50%, -50%) rotate(-12deg);
      z-index: 15;
      overflow: visible;
      pointer-events: none;
    }

    .graffiti .star-body {
      filter: none;
    }

    .graffiti .star-fill {
      fill: var(--pink);
      stroke: var(--pink);
      stroke-width: 10;
      stroke-linejoin: round;
    }

    .graffiti .drip {
      fill: var(--pink);
    }

    .graffiti .text-fill {
      fill: var(--white);
      font-family: 'Horizon', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.1em;
    }

    @media (max-width: 540px) {
      .word-stack {
        gap: 0.18em;
      }

      .bg-word {
        font-size: clamp(2.8rem, 16vw, 8rem);
      }

      .graffiti {
        width: 130vw;
        height: 50vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="Portada BLASST">
    <div class="bg-words" aria-hidden="true">
      <div class="word-stack">
        <span class="bg-word">MUSIC</span>
        <span class="bg-word">DANCE</span>
        <span class="bg-word">DRINKS</span>
        <span class="bg-word">HAPPINESS</span>
        <span class="bg-word">FRIENDS</span>
        <span class="bg-word">KISSES</span>
      </div>
    </div>

    <svg class="graffiti" viewBox="0 0 1400 980" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="starClip">
          <path d="M571 104L706 329L980 361L779 541L842 817L571 669L301 818L364 542L162 360L436 329L571 104Z"/>
        </clipPath>
      </defs>

      <g class="star-body">
        <path class="star-fill" d="M571 104L706 329L980 361L779 541L842 817L571 669L301 818L364 542L162 360L436 329L571 104Z"/>

        <g clip-path="url(#starClip)">
          <g class="text-layer" font-size="170" textLength="0">
            <text class="text-fill" x="276" y="385" transform="rotate(-2 276 385)">MUSIC</text>
            <text class="text-fill" x="290" y="560" transform="rotate(-2 290 560)">DANCE</text>
            <text class="text-fill" x="240" y="735" transform="rotate(-2 240 735)">DRINKS</text>
            <text class="text-fill" x="510" y="265" transform="rotate(-3 510 265)">HAPPINESS</text>
            <text class="text-fill" x="500" y="465" transform="rotate(-3 500 465)">FRIENDS</text>
            <text class="text-fill" x="430" y="640" transform="rotate(-3 430 640)">KISSES</text>
          </g>
        </g>

        <path class="drip" d="M507 701L508 792C503 816 487 842 468 857L458 886L447 857C417 812 409 744 432 702L507 701Z"/>
        <path class="drip" d="M600 722L594 844C590 881 570 919 545 942L526 965L511 942C495 913 480 874 482 834L489 722L600 722Z"/>
        <path class="drip" d="M669 712L672 804C674 847 693 882 724 907L744 928L758 907C778 878 791 837 789 794L783 710L669 712Z"/>
        <path class="drip" d="M440 638L443 711C445 733 452 756 469 770L486 782L500 766C523 744 533 713 530 673L525 636L440 638Z"/>
        <path class="drip" d="M316 572L296 648C286 679 294 713 316 740L332 756L346 740C361 719 369 687 365 649L350 570L316 572Z"/>
      </g>
    </svg>

    <div class="logo-wrap">
      <div class="logo" aria-label="BLASST">BLASST</div>
    </div>
  </main>
</body>
</html>
